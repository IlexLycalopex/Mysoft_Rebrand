<style>

}
.section-nav-inner {

}
.section-nav-item:hover { color: var(--navy); }
.section-nav-item.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.section-nav-mobile {

}
.section-nav-select {

}

.bootcamp-sec { padding: 100px 32px; }
.bootcamp-sec-alt { background: #fff; }
.bootcamp-sec-navy { background: var(--navy); color: #fff; }
.bootcamp-sec-light { background: var(--bg); }
.container { max-width: var(--container); margin: 0 auto; }
.narrow { max-width: var(--container-narrow); margin: 0 auto; }

.hero-bootcamp { background: var(--navy); padding: 96px 32px 88px; }
.hero-breadcrumb { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; font-size: 12px; color: rgba(255,255,255,0.45); }
.hero-breadcrumb a { color: var(--cyan); text-decoration: none; opacity: 0.8; transition: opacity 140ms; }
.hero-breadcrumb a:hover { opacity: 1; }
.hero-breadcrumb-sep { opacity: 0.4; }

.eyebrow-dark {

.accordion-group-title {

.accordion-term {
  border-top: 1px solid var(--border-1); padding: 0;

}
.accordion-term-header {
  padding: 16px 24px; cursor: pointer; display: flex; align-items: flex-start;

.accordion-term-header:hover { background: rgba(0,182,237,0.03); }
.accordion-term-name {

.accordion-chevron { flex-shrink: 0; transition: transform 220ms var(--ease-out); color: var(--muted); }
.accordion-chevron.open { transform: rotate(180deg); }

.pull-quote {
  border-left: 4px solid var(--yellow);
  background: var(--navy); color: #fff;
  padding: 32px 36px; border-radius: 4px;

  letter-spacing: -0.01em;
}

.feature-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 36px 32px;
  display: flex; flex-direction: column;
}
.feature-card-icon {
  width: 48px; height: 48px; border-radius: 4px;

}
.feature-card-h3 {

}
.feature-card-body {
  font-family: var(--font-sans); font-size: 14.5px;
  line-height: 1.65; color: var(--fg-2); flex: 1;
}

.stat-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 28px 24px;

}
.stat-card-icon {
  width: 40px; height: 40px; border-radius: 4px;

}

.question-item {
  display: flex; gap: 20px; padding: 24px 28px;

}
.question-item:first-child { border-top: 1px solid var(--border-1); border-radius: 4px 4px 0 0; }
.question-item:last-child { border-radius: 0 0 4px 4px; border-bottom: 1px solid var(--border-1); }
.question-num {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.4rem; color: var(--cyan); letter-spacing: -0.02em;
  line-height: 1; flex-shrink: 0; width: 32px;
}
.question-text { flex: 1; }
.question-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 15px; color: var(--navy); line-height: 1.4;
}
.question-body { font-family: var(--font-sans); font-size: 13.5px; line-height: 1.65; color: var(--fg-2); }

.journey-step {
  display: flex; flex-direction: column; align-items: center; flex: 1; position: relative;
}
.journey-step-circle {
  width: 44px; height: 44px; border-radius: 50%;

  position: relative; z-index: 2; flex-shrink: 0;
  transition: all 220ms var(--ease-out);
}
.journey-connector {
  position: absolute; top: 22px; left: calc(50% + 22px);

}
.journey-step-label {
  font-family: var(--font-display); font-weight: 600;
  font-size: 14px; color: var(--navy); margin-top: 14px; text-align: center;

}
.journey-step-desc {
  font-family: var(--font-sans); font-size: 12.5px; color: var(--fg-3);
  line-height: 1.5; text-align: center; margin-top: 6px; max-width: 160px;
}
.journey-step-link {
  margin-top: 10px; font-family: var(--font-sans); font-weight: 600;
  font-size: 12px; color: var(--cyan); text-decoration: none; text-align: center;
}
.journey-step-link:hover { text-decoration: underline; }

.sec-eyebrow {
  font-family: var(--font-sans); font-weight: 500;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--cyan); display: block; margin-bottom: 12px;
}
.sec-h2 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 3.2vw, 2.8rem); line-height: 1.1;
  letter-spacing: -0.025em; color: var(--navy); margin: 0;
}
.sec-h2-white {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 3.2vw, 2.8rem); line-height: 1.1;
  letter-spacing: -0.025em; color: #fff; margin: 0;
}

.callout-yellow {
  background: #fff; border: 1px solid var(--border-1);
  border-left: 4px solid var(--yellow);
  border-radius: 4px; padding: 24px 28px;
}
.callout-cyan {
  background: #fff; border: 1px solid var(--border-1);
  border-left: 4px solid var(--cyan);
  border-radius: 4px; padding: 28px 32px;
}

.model-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 32px 28px;
}
.model-card-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.05rem; color: var(--navy); line-height: 1.3; margin: 0 0 16px;
}

/* BI stack pipeline */
.pipeline-wrap {
  display: flex; align-items: stretch; gap: 0;
  margin: 24px 0 0;
}
.pipeline-stage {
  flex: 1; background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 24px 20px; display: flex; flex-direction: column;
  align-items: flex-start; position: relative;
}
.pipeline-stage-icon {
  width: 40px; height: 40px; border-radius: 4px;
  background: rgba(0,182,237,0.08); display: flex; align-items: center; justify-content: center;
  margin-bottom: 14px;
}
.pipeline-stage-num {
  font-family: var(--font-display); font-weight: 700; font-size: 12px;
  color: var(--cyan); margin-bottom: 6px;
}
.pipeline-stage-label {
  font-family: var(--font-display); font-weight: 600; font-size: 14px;
  color: var(--navy); line-height: 1.3; margin-bottom: 8px;
}
.pipeline-stage-desc {
  font-family: var(--font-sans); font-size: 12.5px; color: var(--fg-2); line-height: 1.55;
}
.pipeline-arrow {
  flex: 0 0 28px; display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}

.bc-table-wrap { overflow-x: auto; }
.bc-table { width: 100%; border-collapse: collapse; }
.bc-table th, .bc-table td {
  padding: 14px 18px; text-align: left;
  border: 1px solid var(--border-1); line-height: 1.55;
  vertical-align: top; font-size: 13.5px;
  font-family: var(--font-sans);
}
.bc-table th {
  background: var(--navy); color: #fff;
  font-family: var(--font-display); font-weight: 600;
  font-size: 13px; letter-spacing: -0.01em;
}
.bc-table tr:nth-child(even) td { background: var(--bg); }
.bc-table tr:nth-child(odd) td { background: #fff; }
.bc-table td:first-child { font-weight: 600; color: var(--navy); min-width: 140px; }

@media (max-width: 1023px) {
  .bootcamp-sec { padding: 80px 24px; }
  .hero-bootcamp { padding: 80px 24px 72px; }
  .section-nav { display: none; }
  .section-nav-mobile { display: block; }
  .grid-3-resp { grid-template-columns: repeat(2, 1fr) !important; }
  .grid-2-resp { grid-template-columns: 1fr !important; }
  .journey-wrap { flex-direction: column !important; align-items: flex-start !important; gap: 24px !important; }
  .journey-step { flex-direction: row !important; align-items: flex-start !important; gap: 16px !important; flex: none !important; width: 100% !important; }
  .journey-connector { display: none !important; }
  .journey-step-circle { flex-shrink: 0 !important; }
  .journey-step-label, .journey-step-desc, .journey-step-link { text-align: left !important; max-width: none !important; }

}
@media (max-width: 767px) {
  .bootcamp-sec { padding: 64px 20px; }
  .hero-bootcamp { padding: 64px 20px 56px; }
  .section-nav-mobile { padding: 0 20px; }
  .grid-3-resp { grid-template-columns: 1fr !important; }
}
@media (max-width: 480px) {
  .question-item { padding: 18px 20px; }
  .question-num { font-size: 1.1rem; }
}
</style>

<div id="root"></div>

<script src="../../vendor/react.development.js"></script>
<script src="../../vendor/react-dom.development.js"></script>

<script type="text/babel">

// ─── ICONS ───────────────────────────────────────────────────────────────────

const ICON_PATHS = {
  TrendingUp:  `<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>`,
  BarChart2:   `<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>`,
  Layers:      `<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>`,
  GitBranch:   `<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>`,
  Archive:     `<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>`,
  BookOpen:    `<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>`,
  Database:    `<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>`,
  PieChart:    `<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>`,
  Check:       `<polyline points="20 6 9 17 4 12"/>`,
  ChevronDown: `<polyline points="6 9 12 15 18 9"/>`,
  ArrowRight:  `<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>`,
};

const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.75, style = {} }) => (
  <svg
    viewBox="0 0 24 24" width={size} height={size}
    fill="none" stroke={color}
    strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
    style={style}
    dangerouslySetInnerHTML={{ __html: ICON_PATHS[name] || '' }}
  />
);

// ─── SECTION NAV ─────────────────────────────────────────────────────────────

const BI_NAV_ITEMS = [
  { id: 's1',  label: 'Why BI' },
  { id: 's2',  label: 'Glossary' },
  { id: 's3',  label: 'Reporting vs BI vs AI' },
  { id: 's4',  label: 'The BI Stack' },
  { id: 's5',  label: 'Failure Modes' },
  { id: 's6',  label: 'BI for Finance' },
  { id: 's7',  label: 'BI for Operations' },
  { id: 's8',  label: 'Selecting a Tool' },
  { id: 's9',  label: 'Vendor Questions' },
  { id: 's10', label: 'Mysoft Approach' },
  { id: 's11', label: 'Learning Journey' },
];

const SectionNav = () => {
  const [active, setActive] = React.useState('s1');

  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: '-80px 0px -50% 0px', threshold: 0 }
    );
    BI_NAV_ITEMS.forEach(({ id }) => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 140;
    window.scrollTo({ top, behavior: 'smooth' });
  };

  return (
    <>
      <nav className="section-nav">
        <div className="section-nav-inner">
          {BI_NAV_ITEMS.map(({ id, label }) => (
            <a
              key={id}
              href={'#' + id}
              className={'section-nav-item' + (active === id ? ' active' : '')}
              onClick={e => { e.preventDefault(); scrollTo(id); }}
            >{label}</a>
          ))}
        </div>
      </nav>
      <nav className="section-nav-mobile">
        <select
          className="section-nav-select"
          value={active}
          onChange={e => scrollTo(e.target.value)}
        >
          {BI_NAV_ITEMS.map(({ id, label }) => (
            <option key={id} value={id}>{label}</option>
          ))}
        </select>
      </nav>
    </>
  );
};

// ─── HERO ────────────────────────────────────────────────────────────────────

const HeroSection = () => (
  <section className="hero-bootcamp">
    <div className="container">
      <div className="hero-breadcrumb">
        <a href="../../">Home</a>
        <span className="hero-breadcrumb-sep">/</span>
        <span>Resources</span>
        <span className="hero-breadcrumb-sep">/</span>
        <span style={{ color: 'rgba(255,255,255,0.65)' }}>BI &amp; Analytics Bootcamp</span>
      </div>

      <div style={{ maxWidth: 880 }}>
        <span className="eyebrow-dark">BI &amp; ANALYTICS BOOTCAMP</span>
        <h1 style={{
          fontFamily: 'var(--font-display)', fontWeight: 600,
          fontSize: 'clamp(2.4rem, 4.5vw, 3.8rem)', lineHeight: 1.05,
          letterSpacing: '-0.025em', color: '#fff', margin: '0 0 24px',
        }}>
          Business intelligence: what it actually is, and why most BI projects fail before they start
        </h1>
        <p style={{
          fontFamily: 'var(--font-sans)', fontSize: 'clamp(1rem, 1.3vw, 1.125rem)',
          lineHeight: 1.65, color: 'rgba(255,255,255,0.75)', maxWidth: 720, margin: '0 0 12px',
        }}>
          "Better reporting" is one of the most common reasons mid-market businesses give for investing in ERP or finance systems, and one of the least well defined. This Bootcamp explains what business intelligence actually involves, why it differs from the reports your ERP produces on its own, which tools sit between your financial system and your board pack, and what separates the BI programmes that deliver decisions from the ones that produce dashboards nobody trusts. It is written for finance and operations leaders, not for technologists.
        </p>
        <p style={{
          fontFamily: 'var(--font-sans)', fontSize: 14, color: 'rgba(255,255,255,0.4)',
          margin: 0,
        }}>
          Eleven sections. Built for finance and operations leaders who need to decide, not just understand.
        </p>

        <div style={{
          marginTop: 48, paddingTop: 32, borderTop: '1px solid rgba(255,255,255,0.1)',
          display: 'flex', gap: 32, flexWrap: 'wrap',
        }}>
          {[
            { n: '11', l: 'Core sections', sub: 'From vocabulary to vendor selection' },
            { n: '4',  l: 'Glossary groups', sub: 'Over 30 defined terms' },
            { n: '6',  l: 'BI tools compared', sub: 'Native to specialist' },
            { n: '10', l: 'Vendor questions', sub: 'Shareable checklist' },
          ].map((s, i) => (
            <div key={i} style={{
              paddingLeft: i > 0 ? 32 : 0,
              borderLeft: i > 0 ? '1px solid rgba(255,255,255,0.12)' : 'none',
            }}>

const GLOSSARY_GROUPS = [
  {
    id: 'bg1', title: 'Foundations',
    terms: [
      { term: 'Business Intelligence (BI)', def: 'The tools, processes, and disciplines that turn raw operational and financial data into insight that supports a decision. BI is analytical and exploratory, not just descriptive.' },
      { term: 'Analytics', def: 'The activity of examining data to find patterns, explanations, and predictions. Reporting tells you what happened; analytics helps you understand why and what to do next.' },
      { term: 'Data', def: 'The raw records held in your systems. Data on its own is not information. It becomes information when it is structured, defined, and given context.' },
      { term: 'KPI (Key Performance Indicator)', def: 'A small number of measures that track progress against a specific objective. A KPI is a metric the business has decided to act on.' },
      { term: 'Metric', def: 'Any quantifiable measure. All KPIs are metrics; not all metrics are KPIs.' },
      { term: 'Dashboard', def: 'A single visual surface that brings related metrics together for monitoring. A good dashboard answers a defined set of questions for a defined audience.' },
      { term: 'Report', def: 'A structured presentation of data, usually backward-looking and produced to a fixed format. Reports document; dashboards monitor; analytics explores.' },
      { term: 'Data Literacy', def: 'The ability of people across the business to read, interpret, and question data correctly. Low data literacy is a more common cause of BI failure than poor tooling.' },
    ],
  },
  {
    id: 'bg2', title: 'Architecture',
    terms: [
      { term: 'Data Source', def: 'Any system that holds data you want to analyse: the ERP, the finance system, the CRM, the billing platform, spreadsheets.' },
      { term: 'Data Warehouse', def: 'A central store designed for analysis, holding structured data drawn from multiple sources and organised for fast querying.' },
      { term: 'Data Lake', def: 'A store that holds large volumes of raw data in its native format, structured or not, for later processing. More common in larger or data-intensive organisations than in typical mid-market finance.' },
      { term: 'Data Model', def: 'The way data is structured, related, and defined for analysis. The single biggest determinant of whether BI succeeds.' },
      { term: 'ETL (Extract, Transform, Load)', def: 'The process of taking data from source systems, reshaping it into a consistent structure, and loading it into the warehouse or BI tool.' },
      { term: 'OLAP and Cube', def: 'OLAP (Online Analytical Processing) is a way of pre-organising data across dimensions (time, product, region) so that users can slice and explore it quickly. A cube is the multidimensional structure that makes that exploration fast.' },
      { term: 'Semantic Layer', def: 'A translation layer that maps technical database fields into business language, so that a user selects "Revenue" rather than T_SALES_HDR.AMT_GROSS. Crucial to self-service adoption.' },
    ],
  },
  {
    id: 'bg3', title: 'Visualisation and delivery',
    terms: [
      { term: 'Visualisation', def: 'The presentation of data in charts, tables, and graphics that make patterns legible.' },
      { term: 'Self-Service BI', def: 'The ability for non-technical users such as finance managers and operational leads to build their own reports and dashboards without IT involvement. Depends entirely on a well-governed semantic layer.' },
      { term: 'Embedded Analytics', def: 'BI delivered inside another application, so users see relevant data without switching tools.' },
      { term: 'Drill-Down and Drill-Through', def: 'Drilling down moves from a summary to its detail within the same view; drilling through navigates to a related, more detailed report.' },
      { term: 'Ad Hoc Reporting', def: 'Building a one-off report to answer a specific question, rather than running a pre-built one.' },
      { term: 'Scheduled Report', def: 'A report generated and distributed automatically on a set cadence.' },
    ],
  },
  {
    id: 'bg4', title: 'Advanced',
    terms: [
      { term: 'Descriptive Analytics', def: 'What happened.' },
      { term: 'Predictive Analytics', def: 'What is likely to happen, based on patterns in historical data.' },
      { term: 'Prescriptive Analytics', def: 'What you should do about it, given the prediction.' },
      { term: 'AI-Driven Analytics', def: 'The use of machine learning and AI to surface patterns, anomalies, and answers that would be impractical to find manually.' },
      { term: 'Anomaly Detection', def: 'Automated identification of values that fall outside expected patterns, used for exception monitoring and fraud signals.' },
      { term: 'Natural Language Query (NLQ)', def: 'The ability to ask a BI tool a question in plain English, such as "what was gross margin in Q3 by product line", and receive a visual answer. Increasingly available in modern tools and typically powered by AI.' },
    ],
  },
];

const AccordionGroup = ({ group }) => {
  const [open, setOpen] = React.useState(false);
  const [openTerms, setOpenTerms] = React.useState({});

  const toggleTerm = (i) => setOpenTerms(prev => ({ ...prev, [i]: !prev[i] }));

  return (
    <div className="accordion-group">
      <div className="accordion-group-header" onClick={() => setOpen(o => !o)}>
        <span className="accordion-group-title">{group.title}</span>
        <Icon
          name="ChevronDown" size={18}
          color="var(--muted)"
          style={{ transition: 'transform 220ms', transform: open ? 'rotate(180deg)' : 'none' }}
        />
      </div>
      {open && group.terms.map((t, i) => (
        <div key={i} className="accordion-term">
          <div className="accordion-term-header" onClick={() => toggleTerm(i)}>
            <span className="accordion-term-name">{t.term}</span>
            <Icon
              name="ChevronDown" size={16}
              color="var(--muted)"
              style={{ transition: 'transform 220ms', transform: openTerms[i] ? 'rotate(180deg)' : 'none', flexShrink: 0, marginTop: 2 }}
            />
          </div>
          {openTerms[i] && (
            <div className="accordion-term-body">{t.def}</div>
          )}
        </div>
      ))}
    </div>
  );
};
