<script type="text/babel">

// ─── ICONS ───────────────────────────────────────────────────────────────────

const ICON_PATHS = {
  TrendingUp:  `<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>`,
  Clock:       `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`,
  DollarSign:  `<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>`,
  Cloud:       `<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>`,
  Check:       `<polyline points="20 6 9 17 4 12"/>`,
  ChevronDown: `<polyline points="6 9 12 15 18 9"/>`,
  ArrowRight:  `<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>`,
};

const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.75, style = {} }) => (
  <svg
    viewBox="0 0 24 24" width={size} height={size}
    fill="none" stroke={color}
    strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
    style={style}
    dangerouslySetInnerHTML={{ __html: ICON_PATHS[name] || '' }}
  />
);

// ─── SECTION NAV ─────────────────────────────────────────────────────────────

const CM_NAV_ITEMS = [
  { id: 's1',  label: 'Why Cloud' },
  { id: 's2',  label: 'Glossary' },
  { id: 's3',  label: 'Migration vs Reimplementation' },
  { id: 's4',  label: 'The Business Case' },
  { id: 's5',  label: 'What It Involves' },
  { id: 's6',  label: 'Risk & Change' },
  { id: 's7',  label: 'Customisation & Integration' },
  { id: 's8',  label: 'When Not To Migrate' },
  { id: 's9',  label: 'Vendor Questions' },
  { id: 's10', label: 'Mysoft Approach' },
  { id: 's11', label: 'Learning Journey' },
];

const SectionNav = () => {
  const [active, setActive] = React.useState('s1');

  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: '-80px 0px -50% 0px', threshold: 0 }
    );
    CM_NAV_ITEMS.forEach(({ id }) => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  const scrollTo = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 140;
    window.scrollTo({ top, behavior: 'smooth' });
  };

  return (
    <>
      <nav className="section-nav">
        <div className="section-nav-inner">
          {CM_NAV_ITEMS.map(({ id, label }) => (
            <a
              key={id}
              href={'#' + id}
              className={'section-nav-item' + (active === id ? ' active' : '')}
              onClick={e => { e.preventDefault(); scrollTo(id); }}
            >{label}</a>
          ))}
        </div>
      </nav>
      <nav className="section-nav-mobile">
        <select
          className="section-nav-select"
          value={active}
          onChange={e => scrollTo(e.target.value)}
        >
          {CM_NAV_ITEMS.map(({ id, label }) => (
            <option key={id} value={id}>{label}</option>
          ))}
        </select>
      </nav>
    </>
  );
};

// ─── HERO ────────────────────────────────────────────────────────────────────

const HeroSection = () => (
  <section className="hero-bootcamp">
    <div className="container">
      <div className="hero-breadcrumb">
        <a href="../../">Home</a>
        <span className="hero-breadcrumb-sep">/</span>
        <span>Resources</span>
        <span className="hero-breadcrumb-sep">/</span>
        <span style={{ color: 'rgba(255,255,255,0.65)' }}>Cloud Migration Bootcamp</span>
      </div>

      <div style={{ maxWidth: 880 }}>
        <span className="eyebrow-dark">CLOUD MIGRATION BOOTCAMP</span>
        <h1 style={{
          fontFamily: 'var(--font-display)', fontWeight: 600,
          fontSize: 'clamp(2.4rem, 4.5vw, 3.8rem)', lineHeight: 1.05,
          letterSpacing: '-0.025em', color: '#fff', margin: '0 0 24px',
        }}>
          Moving your ERP to the cloud: what it actually involves, and how to get it right
        </h1>
        <p style={{
          fontFamily: 'var(--font-sans)', fontSize: 'clamp(1rem, 1.3vw, 1.125rem)',
          lineHeight: 1.65, color: 'rgba(255,255,255,0.75)', maxWidth: 720, margin: '0 0 12px',
        }}>
          Cloud migration is one of the most consequential decisions a finance or operations leader makes about their technology, and one of the most commonly misunderstood. This Bootcamp cuts through the vendor narrative on both sides to explain what cloud migration actually involves for a mid-market business, what the genuine benefits and risks are, and what separates the migrations that deliver from the ones that create disruption. It is written for the leaders who carry the decision, not for the IT team that executes it.
        </p>
        <p style={{
          fontFamily: 'var(--font-sans)', fontSize: 14, color: 'rgba(255,255,255,0.4)',
          margin: 0,
        }}>
          Eleven sections. Built for the finance and operations leaders who own the decision.
        </p>

        <div style={{
          marginTop: 48, paddingTop: 32, borderTop: '1px solid rgba(255,255,255,0.1)',
          display: 'flex', gap: 32, flexWrap: 'wrap',
        }}>
          {[
            { n: '11', l: 'Core sections', sub: 'From context to recommendation' },
            { n: '4',  l: 'Glossary groups', sub: 'Cloud, migration, technical, commercial' },
            { n: '6',  l: 'Project phases', sub: 'Assessment to optimisation' },
            { n: '10', l: 'Vendor questions', sub: 'Shareable checklist' },
          ].map((s, i) => (
            <div key={i} style={{
              paddingLeft: i > 0 ? 32 : 0,
              borderLeft: i > 0 ? '1px solid rgba(255,255,255,0.12)' : 'none',
            }}>
              <div style={{
                fontFamily: 'var(--font-display)', fontWeight: 700,
                fontSize: '2rem', color: '#fff', letterSpacing: '-0.03em', lineHeight: 1,
              }}>{s.n}</div>
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'rgba(255,255,255,0.7)', marginTop: 5 }}>{s.l}</div>
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 11.5, color: 'rgba(255,255,255,0.4)', marginTop: 2 }}>{s.sub}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  </section>
);

// ─── SEC 1: WHY CLOUD ─────────────────────────────────────────────────────────

const WhyCloudSection = () => (
  <section id="s1" className="bootcamp-sec bootcamp-sec-light">
    <div className="container">
      <div className="narrow" style={{ padding: 0 }}>
        <span className="sec-eyebrow">THE CONTEXT</span>
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Why the cloud migration conversation is now unavoidable
        </h2>
        <p style={{ fontSize: 16, lineHeight: 1.7, color: 'var(--fg-2)', margin: '0 0 20px' }}>
          The conversation has moved from whether to when, and it has done so for reasons that compound rather than stand still. Software vendors have shifted their investment to cloud-first development. On-premise platforms continue to be supported, but new capability, AI capability in particular, arrives in the cloud versions first and fastest. Each year on an on-premise system is therefore a year further from the infrastructure that new capability assumes.
        </p>
        <p style={{ fontSize: 16, lineHeight: 1.7, color: 'var(--fg-2)', margin: '0 0 20px' }}>
          The cost comparison has also moved. Once the full cost of on-premise is modelled honestly, including licence, hardware, data centre, backup, internal IT support, and the periodic upgrade projects, cloud subscription economics are competitive over a five-year horizon for most mid-market businesses, and frequently favourable beyond year three. The workforce has moved too: remote access, mobile capability, and the removal of VPN dependency are now baseline expectations for finance and operations teams, not differentiators.

const GLOSSARY_GROUPS = [
  {
    id: 'cg1', title: 'Cloud fundamentals',
    terms: [
      { term: 'Cloud', def: 'Computing delivered as a service over the internet rather than from servers you own and run.' },
      { term: 'SaaS (Software as a Service)', def: 'Software delivered and maintained by the vendor over the internet, paid for by subscription, with updates applied centrally.' },
      { term: 'Cloud-Native', def: 'Software designed from the outset to run in the cloud, typically multi-tenant, rather than on-premise software hosted remotely.' },
      { term: 'Cloud-Hosted', def: 'On-premise software run on remote infrastructure. It removes some hardware burden but does not deliver the full benefits of a cloud-native platform.' },
      { term: 'Multi-Tenant and Single-Tenant', def: 'Multi-tenant means many customers share one maintained instance of the software, each with their data isolated, which is how continuous updates become possible. Single-tenant means a dedicated instance per customer.' },
      { term: 'Private Cloud and Public Cloud', def: 'Private cloud is infrastructure dedicated to one organisation; public cloud is shared, scalable infrastructure operated by a provider.' },
    ],
  },
  {
    id: 'cg2', title: 'Migration concepts',
    terms: [
      { term: 'Cloud Migration', def: 'Moving a system and its data from on-premise infrastructure to the cloud.' },
      { term: 'Lift and Shift', def: 'Moving existing configuration to cloud infrastructure with minimal change.' },
      { term: 'Re-platforming and Re-implementation', def: 'Re-platforming adapts the system to the new environment; re-implementation rebuilds it, rationalising configuration and redesigning processes.' },
      { term: 'Data Migration', def: 'Moving data from the old system to the new, including the cleanse and validation that should accompany it.' },
      { term: 'Cutover', def: 'The point at which the business stops using the old system and starts using the new one.' },
      { term: 'Parallel Running', def: 'Operating old and new systems together for a period to validate the new one before full cutover.' },
      { term: 'Go-Live', def: 'The point at which the new system becomes the system of record.' },
    ],
  },
  {
    id: 'cg3', title: 'Technical',

      { term: 'Integration and Middleware', def: 'Integration connects systems so they share data; middleware is the software layer that brokers those connections.' },
      { term: 'Legacy System', def: 'An older system, often on-premise and heavily customised, that is costly to change and may block modernisation.' },
      { term: 'Technical Debt', def: 'The accumulated cost of past configuration choices, customisations, and workarounds that were never rationalised.' },
      { term: 'Customisation and Configuration', def: 'Configuration uses the system\'s built-in settings to meet a requirement; customisation changes the system itself through code. The distinction drives cost, upgradeability, and risk.' },

    id: 'cg4', title: 'Commercial',

const AccordionGroup = ({ group }) => {
  const [open, setOpen] = React.useState(false);

  return (
    <div className="accordion-group">
      <div className="accordion-group-header" onClick={() => setOpen(o => !o)}>
        <span className="accordion-group-title">{group.title}</span>
        <Icon
          name="ChevronDown" size={18}
          color="var(--muted)"
          style={{ transition: 'transform 220ms', transform: open ? 'rotate(180deg)' : 'none' }}
        />
      </div>
      {open && group.terms.map((t, i) => (
        <div key={i} className="accordion-term">
          <div className="accordion-term-header" onClick={() => toggleTerm(i)}>
            <span className="accordion-term-name">{t.term}</span>
            <Icon
              name="ChevronDown" size={16}
              color="var(--muted)"
              style={{ transition: 'transform 220ms', transform: openTerms[i] ? 'rotate(180deg)' : 'none', flexShrink: 0, marginTop: 2 }}

          {openTerms[i] && (

  );
};
