.bootcamp-sec { padding: 100px 32px; }

.eyebrow-dark {

.comparison-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  width: 100%; border-collapse: collapse;

}
.comparison-table th, .comparison-table td {

}

.accordion-group { border: 1px solid var(--border-1); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
.accordion-group-header {
  padding: 18px 24px; background: var(--bg);
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  user-select: none; transition: background 140ms;
}
.accordion-group-header:hover { background: #eaedef; }
.accordion-group-title {
  font-family: var(--font-sans); font-weight: 600;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--navy);
}
.accordion-term {
  border-top: 1px solid var(--border-1); padding: 0;
  background: #fff;
}
.accordion-term-header {
  padding: 16px 24px; cursor: pointer; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 16px; user-select: none;
  transition: background 140ms;
}
.accordion-term-header:hover { background: rgba(0,182,237,0.03); }
.accordion-term-name {
  font-family: var(--font-display); font-weight: 600;
  font-size: 15px; color: var(--navy); line-height: 1.3;
}
.accordion-term-body {
  padding: 0 24px 20px;
  font-family: var(--font-sans); font-size: 14.5px;
  line-height: 1.65; color: var(--fg-2);
}
.accordion-chevron { flex-shrink: 0; transition: transform 220ms var(--ease-out); color: var(--muted); }
.accordion-chevron.open { transform: rotate(180deg); }

.pull-quote {
  border-left: 4px solid var(--yellow);
  background: var(--navy); color: #fff;
  padding: 32px 36px; border-radius: 4px;
  font-family: var(--font-display); font-weight: 500;
  font-size: clamp(1rem, 1.4vw, 1.2rem); line-height: 1.5;
  letter-spacing: -0.01em;
}

.feature-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 36px 32px;
  display: flex; flex-direction: column;
}
.feature-card-icon {
  width: 48px; height: 48px; border-radius: 4px;
  background: rgba(0,182,237,0.08);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px; flex-shrink: 0;
}
.feature-card-h3 {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.2rem; color: var(--navy);
  line-height: 1.25; margin: 0 0 16px; letter-spacing: -0.01em;
}
.feature-card-body {
  font-family: var(--font-sans); font-size: 14.5px;
  line-height: 1.65; color: var(--fg-2); flex: 1;
}

.stat-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 28px 24px;
  display: flex; gap: 16px; align-items: flex-start;
}
.stat-card-icon {
  width: 40px; height: 40px; border-radius: 4px;

}

.question-item {

  border-bottom: 1px solid var(--border-1);
  background: #fff; align-items: flex-start;
}
.question-item:first-child { border-top: 1px solid var(--border-1); border-radius: 4px 4px 0 0; }
.question-item:last-child { border-radius: 0 0 4px 4px; border-bottom: 1px solid var(--border-1); }
.question-num {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.4rem; color: var(--cyan); letter-spacing: -0.02em;
  line-height: 1; flex-shrink: 0; width: 32px;
}
.question-text { flex: 1; }
.question-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 15px; color: var(--navy); line-height: 1.3; margin-bottom: 8px;
}
.question-body { font-family: var(--font-sans); font-size: 13.5px; line-height: 1.65; color: var(--fg-2); }

.journey-step {
  display: flex; flex-direction: column; align-items: center; flex: 1; position: relative;
}
.journey-step-circle {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 16px;
  position: relative; z-index: 2; flex-shrink: 0;
  transition: all 220ms var(--ease-out);
}
.journey-connector {
  position: absolute; top: 22px; left: calc(50% + 22px);
  right: calc(-50% + 22px); height: 1px; background: var(--border-1);
}
.journey-step-label {
  font-family: var(--font-display); font-weight: 600;
  font-size: 14px; color: var(--navy); margin-top: 14px; text-align: center;
  line-height: 1.3;
}
.journey-step-desc {
  font-family: var(--font-sans); font-size: 12.5px; color: var(--fg-3);
  line-height: 1.5; text-align: center; margin-top: 6px; max-width: 160px;
}
.journey-step-link {
  margin-top: 10px; font-family: var(--font-sans); font-weight: 600;
  font-size: 12px; color: var(--cyan); text-decoration: none; text-align: center;
}
.journey-step-link:hover { text-decoration: underline; }

.sec-eyebrow {
  font-family: var(--font-sans); font-weight: 500;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--cyan); display: block; margin-bottom: 12px;
}
.sec-h2 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 3.2vw, 2.8rem); line-height: 1.1;
  letter-spacing: -0.025em; color: var(--navy); margin: 0;
}
.sec-h2-white {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 3.2vw, 2.8rem); line-height: 1.1;
  letter-spacing: -0.025em; color: #fff; margin: 0;
}

/* Spectrum scale */
.spectrum-wrap {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0; margin: 40px 0 0; position: relative;
}
.spectrum-point {
  background: #fff; border: 1px solid var(--border-1);
  padding: 24px 20px; position: relative;
}
.spectrum-point:not(:first-child) { border-left: none; }
.spectrum-point-num {
  font-family: var(--font-display); font-weight: 700;
  font-size: 1.8rem; color: var(--border-1); letter-spacing: -0.03em;
  line-height: 1; margin-bottom: 10px;
}
.spectrum-label {
  font-family: var(--font-display); font-weight: 600;
  font-size: 14px; color: var(--navy); line-height: 1.3; margin-bottom: 8px;
}
.spectrum-desc {
  font-family: var(--font-sans); font-size: 13px;
  color: var(--fg-2); line-height: 1.55; margin-bottom: 12px;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-sans); font-weight: 600; font-size: 10.5px;
  padding: 3px 9px; border-radius: 999px; margin: 2px 0;
}
.chip-bad  { background: rgba(216,10,72,0.08); color: #D80A48; }
.chip-good { background: rgba(0,182,237,0.1); color: #007da8; }
.chip-part { background: rgba(248,197,86,0.15); color: #8a6600; }

/* Callout card (yellow border) */
.callout-yellow {
  background: #fff; border: 1px solid var(--border-1);
  border-left: 4px solid var(--yellow);
  border-radius: 4px; padding: 24px 28px;
}
.callout-cyan {
  background: #fff; border: 1px solid var(--border-1);
  border-left: 4px solid var(--cyan);
  border-radius: 4px; padding: 28px 32px;
}

/* Myth bust */
.myth-table-wrap { overflow-x: auto; }
.myth-table { width: 100%; border-collapse: collapse; }
.myth-table td {
  padding: 14px 20px; border: 1px solid var(--border-1);
  font-family: var(--font-sans); font-size: 14px; line-height: 1.55;
  vertical-align: top;
}
.myth-table tr:nth-child(odd) td { background: #fff; }
.myth-table tr:nth-child(even) td { background: var(--bg); }
.myth-table td:first-child { width: 36px; }
.myth-table td:nth-child(2) { color: var(--fg-2); font-style: italic; }
.myth-table td:nth-child(3) { color: var(--fg-1); }

/* Timeline */
.timeline-list { list-style: none; padding: 0; margin: 0; position: relative; }
.timeline-list::before {
  content: ''; position: absolute; left: 56px; top: 0; bottom: 0;
  width: 1px; background: var(--border-1);
}
.timeline-item {
  display: flex; gap: 24px; align-items: flex-start;
  padding: 0 0 32px; position: relative;
}
.timeline-date {
  flex-shrink: 0; width: 56px; text-align: right;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  color: var(--navy); line-height: 1.2; padding-top: 2px;
}
.timeline-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  margin-top: 4px; position: relative; z-index: 1;
}
.timeline-content { flex: 1; }
.timeline-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 15px; color: var(--navy); margin-bottom: 4px; line-height: 1.3;
}
.timeline-body { font-family: var(--font-sans); font-size: 13.5px; color: var(--fg-2); line-height: 1.6; }
.timeline-scope {
  display: inline-block; margin-top: 6px;
  font-family: var(--font-sans); font-weight: 600; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--navy); color: rgba(255,255,255,0.8);
  padding: 3px 9px; border-radius: 999px;
}

/* Integration model card */
.model-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 32px 28px;
}
.model-card-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.05rem; color: var(--navy); line-height: 1.3; margin: 0 0 16px;
}
.model-card dl { margin: 0; }
.model-card dt {
  font-family: var(--font-sans); font-weight: 600; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  margin: 14px 0 4px;
}
.model-card dd {
  font-family: var(--font-sans); font-size: 13.5px; color: var(--fg-2);
  line-height: 1.6; margin: 0;
}

/* AP/AR comparison */
.compare-card {
  background: #fff; border: 1px solid var(--border-1);
  border-radius: 4px; padding: 32px 28px;
}
.compare-card-title {
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.1rem; color: var(--navy); margin: 0 0 20px; line-height: 1.3;
}
.compare-steps { list-style: none; padding: 0; margin: 0 0 20px; counter-reset: step; }
.compare-steps li {
  counter-increment: step; display: flex; gap: 12px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px solid var(--border-1); font-size: 13.5px;
  color: var(--fg-2); line-height: 1.5;
}
.compare-steps li:last-child { border-bottom: none; }
.compare-steps li::before {
  content: counter(step); flex-shrink: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
  color: var(--cyan); width: 20px;
}
.compare-sub-title {
  font-family: var(--font-sans); font-weight: 600; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px;
}
.compare-bullets { list-style: none; padding: 0; margin: 0; }
.compare-bullets li {
  font-family: var(--font-sans); font-size: 13.5px; color: var(--fg-2);
  line-height: 1.55; padding: 4px 0 4px 18px; position: relative;
}
.compare-bullets li::before {
  content: '–'; position: absolute; left: 0; color: var(--cyan);
}

/* Business case table */
.bc-table-wrap { overflow-x: auto; }
.bc-table { width: 100%; border-collapse: collapse; }
.bc-table th, .bc-table td {
  padding: 14px 18px; text-align: left;
  border: 1px solid var(--border-1); line-height: 1.55;
  vertical-align: top; font-size: 13.5px;
  font-family: var(--font-sans);
}
.bc-table th {
  background: var(--navy); color: #fff;
  font-family: var(--font-display); font-weight: 600;
  font-size: 13px; letter-spacing: -0.01em;
}
.bc-table tr:nth-child(even) td { background: var(--bg); }
.bc-table tr:nth-child(odd) td { background: #fff; }
.bc-table td:first-child { font-weight: 600; color: var(--navy); min-width: 180px; }
.bc-table td:last-child { color: var(--fg-2); font-size: 13px; min-width: 240px; }

@media (max-width: 1023px) {
  .bootcamp-sec { padding: 80px 24px; }
  .hero-bootcamp { padding: 80px 24px 72px; }
  .section-nav { display: none; }
  .section-nav-mobile { display: block; }
  .grid-3-resp { grid-template-columns: repeat(2, 1fr) !important; }
  .grid-2-resp { grid-template-columns: 1fr !important; }
  .journey-wrap { flex-direction: column !important; align-items: flex-start !important; gap: 24px !important; }
  .journey-step { flex-direction: row !important; align-items: flex-start !important; gap: 16px !important; flex: none !important; width: 100% !important; }
  .journey-connector { display: none !important; }
  .journey-step-circle { flex-shrink: 0 !important; }
  .journey-step-label, .journey-step-desc, .journey-step-link { text-align: left !important; max-width: none !important; }
  .two-col-compare { grid-template-columns: 1fr !important; }
  .spectrum-wrap { grid-template-columns: repeat(2, 1fr) !important; }
  .spectrum-point:not(:first-child) { border-left: 1px solid var(--border-1); }
  .spectrum-point:nth-child(2) { border-left: none; }
}
@media (max-width: 767px) {
  .bootcamp-sec { padding: 64px 20px; }
  .hero-bootcamp { padding: 64px 20px 56px; }
  .section-nav-mobile { padding: 0 20px; }
  .grid-3-resp { grid-template-columns: 1fr !important; }
  .spectrum-wrap { grid-template-columns: 1fr !important; }
  .spectrum-point:not(:first-child) { border-left: 1px solid var(--border-1) !important; border-top: none; }
}
@media (max-width: 480px) {
  .question-item { padding: 18px 20px; }
  .question-num { font-size: 1.1rem; }
}
</style>

const SectionNav = () => {
  const [active, setActive] = React.useState('s1');

  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: '-80px 0px -50% 0px', threshold: 0 }
    );
    EINVOICING_NAV_ITEMS.forEach(({ id }) => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);

    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 140;

  };

  return (
    <>
      <nav className="section-nav">
        <div className="section-nav-inner">
          {EINVOICING_NAV_ITEMS.map(({ id, label }) => (
            <a
              key={id}
              href={'#' + id}
              className={'section-nav-item' + (active === id ? ' active' : '')}
              onClick={e => { e.preventDefault(); scrollTo(id); }}

          ))}
        </div>
      </nav>
      <nav className="section-nav-mobile">
        <select
          className="section-nav-select"
          value={active}
          onChange={e => scrollTo(e.target.value)}

            <option key={id} value={id}>{label}</option>
          ))}
        </select>

  );
};

const GLOSSARY_GROUPS = [
  {
    id: 'eg1', title: 'Foundations',
    terms: [
      { term: 'eInvoicing (Electronic Invoicing)', def: 'The exchange of invoice documents between a supplier and a buyer in a structured electronic format — not as a PDF attachment to an email, and not as a scanned paper document. The defining characteristic of a true eInvoice is that it is machine-readable: the data within it can be processed automatically by the recipient\'s financial system without manual re-entry or interpretation.' },
      { term: 'Structured Invoice', def: 'An invoice formatted according to a defined data standard — such as UBL 2.1 or UN/CEFACT CII — in which every data field (supplier name, buyer reference, line items, VAT amount, payment terms) occupies a defined position in a defined format. Structured invoices can be processed automatically by ERP and financial management systems. PDFs, Word documents, and scanned images are not structured invoices.' },
      { term: 'Unstructured Invoice', def: 'An invoice in a format designed for human reading — a PDF, a Word document, a printed paper invoice. Unstructured invoices require manual data entry or OCR (optical character recognition) processing before they can be recorded in a financial system. They are not eInvoices in the regulatory or technical sense, even when sent electronically.' },
      { term: 'Hybrid Invoice', def: 'An invoice format that combines a human-readable document (typically a PDF) with an embedded structured data file. ZUGFeRD (used in Germany) and Factur-X (used in France) are the most common hybrid formats. The PDF is presented to human recipients; the embedded XML data is processed by financial systems. Hybrid formats reduce the implementation barrier for recipients who are not yet ready to receive and process fully structured invoices.' },
      { term: 'PDF Invoice', def: 'A portable document format invoice. Despite being sent electronically — by email or supplier portal — a PDF invoice is not an eInvoice. It requires manual data entry or OCR processing to record in a financial system. PDF invoices are not compliant with EU eInvoicing mandates, even when sent through an electronic channel.' },
    ],
  },
  {
    id: 'eg2', title: 'Standards & Formats',
    terms: [
      { term: 'Peppol (Pan-European Public Procurement On-Line)', def: 'An international network and set of standards for the electronic exchange of business documents — invoices, purchase orders, despatch advice — between organisations. Peppol defines both the transport network (how documents are securely exchanged) and the document standards (the format the documents must conform to). Adopted by public sector buyers across the EU, UK, Australia, Singapore, and other countries.' },
      { term: 'Peppol BIS (Business Interoperability Specifications)', def: 'The document format specifications that govern eInvoices exchanged on the Peppol network. Peppol BIS Billing 3.0 is the current standard for invoices, based on UBL 2.1 and compliant with the European e-Invoice standard (EN 16931). A Peppol BIS invoice can be exchanged with any organisation connected to the Peppol network, regardless of their ERP or financial system.' },
      { term: 'Peppol Access Point', def: 'A certified service provider that connects an organisation to the Peppol network, handling the routing, security, and delivery of electronic documents. To send or receive Peppol invoices, an organisation must either have their own access point or use a certified access point provider. X3CloudDocs connects Sage X3 customers to the Peppol network via a certified access point.' },
      { term: 'UBL 2.1 (Universal Business Language)', def: 'An XML-based standard for structured business documents, developed by OASIS. UBL 2.1 defines the data model for invoices, purchase orders, and other commercial documents exchanged electronically. It is the foundation of the Peppol BIS standard and the European standard EN 16931.' },
      { term: 'UN/CEFACT CII (Cross Industry Invoice)', def: 'An alternative XML standard for structured invoices, developed by the United Nations. CII is used as the alternative to UBL in some national implementations of EN 16931 — notably in Germany (ZUGFeRD) and France (Factur-X). Some eInvoicing platforms support both UBL and CII; others support only one.' },
      { term: 'EN 16931', def: 'The European standard for the semantic data model of a core electronic invoice — defining what data elements a compliant eInvoice must contain and how they should be expressed. All eInvoices exchanged under EU mandate must comply with EN 16931. National implementations (Peppol BIS, XRechnung, ChorusPro, FatturaPA) are all built on this standard.' },
      { term: 'EDI (Electronic Data Interchange)', def: 'A set of standards for the structured electronic exchange of business documents between organisations — predating the internet and XML. EDI standards (EDIFACT, ANSI X12) are used primarily in retail and logistics supply chains, where large buyers mandate EDI-compliant document exchange from their suppliers. EDI and Peppol/UBL-based eInvoicing are parallel approaches — EDI is established in B2B supply chains; Peppol is dominant in public sector and cross-border B2B.' },
      { term: 'ZUGFeRD / Factur-X', def: 'A hybrid invoice format used in Germany (ZUGFeRD) and France (Factur-X) that combines a PDF document with an embedded XML data file conforming to UN/CEFACT CII. The same file serves both human and machine readers. ZUGFeRD is mandatory for B2G (business-to-government) invoices in Germany; the B2B mandate is following.' },
      { term: 'XRechnung', def: 'Germany\'s national eInvoicing standard for B2G transactions — mandatory for all invoices to German federal government buyers. Based on EN 16931 and UBL 2.1 or UN/CEFACT CII. German businesses invoicing public sector customers must submit XRechnung-compliant invoices through the central invoice portal (ZRE or OZG-RE).' },
      { term: 'FatturaPA', def: 'Italy\'s national eInvoicing format, mandatory for all B2B and B2C domestic invoicing in Italy since 2019. All Italian invoices must be exchanged through the Sistema di Interscambio (SdI) — Italy\'s government-operated invoice clearance system. One of the most mature mandatory eInvoicing systems in the EU, and a model for the broader ViDA rollout.' },
    ],
  },
  {
    id: 'eg3', title: 'Regulatory & Compliance',
    terms: [
      { term: 'ViDA (VAT in the Digital Age)', def: 'The EU legislative initiative adopted in 2024 that introduces mandatory structured eInvoicing and digital VAT reporting for intra-EU B2B transactions. ViDA has three pillars: digital reporting requirements (replacing EC Sales Lists and Intrastat), deemed supplier rules for platform economy businesses, and the single EU VAT registration. The eInvoicing and digital reporting pillar requires real-time or near-real-time reporting of invoice data to tax authorities.' },
      { term: 'CTC (Continuous Transaction Control)', def: 'A model of VAT compliance in which invoice data is reported to, or cleared by, tax authorities at or near the time of transaction — rather than in periodic returns. Italy\'s SdI and Spain\'s SII are examples. Under ViDA\'s digital reporting requirements, some form of CTC will apply across EU member states from 2030.' },
      { term: 'B2G (Business to Government)', def: 'Invoices issued by a business to a government or public sector buyer. B2G eInvoicing mandates are already live across the EU and increasingly in the UK. If you invoice any public sector organisation in the UK or EU, you are likely already subject to eInvoicing requirements.' },
      { term: 'B2B (Business to Business)', def: 'Invoices exchanged between private sector businesses. B2B eInvoicing mandates are the next wave — live in Italy (2019), France (2026), Germany (2027), and rolling out across the EU under ViDA by 2030. UK B2B eInvoicing is not yet mandated but the direction of travel is clear.' },
      { term: 'Making Tax Digital (MTD)', def: 'HMRC\'s programme requiring businesses to maintain digital records and submit VAT returns through compatible software. MTD for VAT is mandatory for all VAT-registered businesses. MTD for Income Tax is being rolled out for self-employed individuals and landlords. MTD does not currently mandate eInvoicing but is part of the same direction of digitisation.' },
      { term: 'VAT Gap', def: 'The difference between the VAT revenue a government expects to collect and the amount actually collected. EU governments cite the VAT gap — estimated at €89 billion across the EU in 2021 (European Commission) — as the primary driver of eInvoicing mandates. Structured eInvoicing provides tax authorities with transaction-level data that makes VAT evasion significantly harder to sustain.' },
    ],
  },
  {
    id: 'eg4', title: 'Integration & Process',
    terms: [
      { term: 'AP Automation (Accounts Payable Automation)', def: 'The use of technology to automate the processing of supplier invoices — from receipt, through matching and approval, to payment — reducing manual data entry and processing time. eInvoicing is the upstream input that enables AP automation: structured invoices arrive in machine-readable format, ready for automated matching without OCR or manual keying.' },
      { term: 'OCR (Optical Character Recognition)', def: 'Technology that converts scanned or image-based documents into machine-readable text. OCR is a workaround for the absence of structured eInvoicing — it attempts to extract invoice data from PDFs or scans rather than receiving it in structured format. OCR is inherently error-prone and will be displaced by structured eInvoicing as mandates take effect.' },
      { term: 'Supplier Portal', def: 'A web-based platform through which suppliers submit invoices to a buyer — typically provided or mandated by large buyers (retailers, public sector bodies). Supplier portals vary in their support for structured formats — some accept only PDF upload (unstructured); others accept EDI or Peppol-format invoices. Compliance with a buyer\'s supplier portal is often a trading condition.' },
      { term: 'Three-Way Matching', def: 'The automated process of validating a supplier invoice against the corresponding purchase order and goods receipt — confirming that what was ordered, what was received, and what is being invoiced are consistent. Three-way matching is a core AP automation control, and it is most reliably automated when the input invoice is structured and machine-readable.' },
      { term: 'Peppol ID', def: 'A unique identifier that locates an organisation on the Peppol network — enabling other Peppol participants to send electronic documents directly to that organisation without manual routing. A Peppol ID is analogous to an email address, but for structured business documents. UK organisations can register a Peppol ID through a certified access point provider.' },
    ],
  },
];

const AccordionGroup = ({ group }) => {
  const [open, setOpen] = React.useState(false);
  const [openTerms, setOpenTerms] = React.useState({});

  const toggleTerm = (i) => setOpenTerms(prev => ({ ...prev, [i]: !prev[i] }));

  return (
    <div className="accordion-group">
      <div className="accordion-group-header" onClick={() => setOpen(o => !o)}>
        <span className="accordion-group-title">{group.title}</span>
        <Icon
          name="ChevronDown" size={18}
          color="var(--muted)"
          style={{ transition: 'transform 220ms', transform: open ? 'rotate(180deg)' : 'none' }}
        />
      </div>
      {open && group.terms.map((t, i) => (
        <div key={i} className="accordion-term">
          <div className="accordion-term-header" onClick={() => toggleTerm(i)}>
            <span className="accordion-term-name">{t.term}</span>
            <Icon
              name="ChevronDown" size={16}
              color="var(--muted)"
              style={{ transition: 'transform 220ms', transform: openTerms[i] ? 'rotate(180deg)' : 'none', flexShrink: 0, marginTop: 2 }}
            />
          </div>
          {openTerms[i] && (
            <div className="accordion-term-body">{t.def}</div>
          )}
        </div>
      ))}
    </div>
  );
};
