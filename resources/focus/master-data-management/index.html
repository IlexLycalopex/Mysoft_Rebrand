// ─── SEC 1 ───────────────────────────────────────────────────────────────────

const WhyMatterSection = () => (
  <section id="s1" className="focus-sec focus-sec-light">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Why master data is the foundation that ERP and AI performance rests on
        </h2>
        <p className="focus-p">
          Every ERP transaction depends on master data. A purchase order depends on a supplier record, a sales order depends on a customer record and a product record, a journal depends on the chart of accounts. The quality of each transaction is therefore bounded by the quality of the master data it references, which means master data is not a back-office detail. It is the substrate the whole system runs on.
        </p>
        <p className="focus-p">
          Master data problems also compound rather than stay contained. A single duplicated supplier record means two payment histories, two credit limits, and two sets of tax codes. Automated three-way matching fails on the duplicate, accounts payable automation rejects invoices that reference a supplier not in the master, and AI coding models are confused by inconsistently coded data. One bad record becomes a chain of downstream failures.
        </p>
        <p className="focus-p">
          There is an audit and fraud dimension too. Auditors ask how suppliers are approved. If the honest answer is that anyone in the accounts payable team can add a supplier by filling in a form, the audit-trail question follows immediately, because ungoverned master data is a control weakness, not just an operational inconvenience. And the evidence base is clear: inadequate data preparation consistently ranks among the leading causes of ERP implementations failing to meet their objectives, and poor master data is rarely the sole cause but is almost always a contributing factor.
        </p>
      </div>
    </div>
  </section>
);

// ─── SEC 3 ───────────────────────────────────────────────────────────────────

const FailureSection = () => (
  <section id="s3" className="focus-sec focus-sec-light">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          How master data problems arise, and why they are hard to see until they cause a problem
        </h2>
        <p className="focus-p">
          Most master data problems come from a small set of recurring causes. The first is the absence of an approval workflow for additions: new suppliers, customers, and products are added by operational staff without structured review, so quality degrades continuously and invisibly. The second is data migration carrying the problem in: an implementation that migrates legacy data without a structured cleanse-and-deduplicate programme imports the existing problems at go-live, so the new system starts dirty on day one. The third is the absence of a periodic audit: data that was accurate at go-live drifts as suppliers change bank details, products are discontinued without being deactivated, and customers change legal names, and without scheduled review the drift accumulates silently. The fourth is multiple entry points with no governance: sales entering customers, accounts payable entering suppliers, and the warehouse entering products, each with different conventions, because consistency requires governance rather than instructions.
        </p>
        <p className="focus-p">
          Underlying all four is a visibility problem. Master data quality issues are usually invisible until they cause an operational failure, an accounts payable rejection, a payment to a wrong bank account, or a stock variance that will not reconcile. By the time the symptom surfaces, the root cause is months old and the data is already widely corrupted, which is why prevention through governance is so much cheaper than remediation.
        </p>

// ─── SEC 4 ───────────────────────────────────────────────────────────────────

const AIFoundationSection = () => (
  <section id="s4" className="focus-sec focus-sec-alt">

        </p>
        <p className="focus-p">
          This is why data quality is one of the five domains in Mysoft's AI Readiness Assessment. A business with poor master data governance scores at Stage 1 regardless of its ERP sophistication or its AI ambition, and the assessment recommendation in that case is always to address master data before activating AI. The specific risk is worth stating plainly: AI confidence is not the same as AI accuracy. An accounts payable automation system coding invoices against a poor supplier master will code confidently and wrongly, and human-in-the-loop governance catches that only if the exception thresholds are configured to catch it. The practical implication is straightforward. Any business planning AI activation at Stage 2 or Stage 3 of the maturity ladder should conduct a master data audit before project initiation, and the audit scope and remediation estimate should sit inside the business case rather than emerge as a surprise during delivery.
        </p>

// ─── SEC 5 ───────────────────────────────────────────────────────────────────

const GovernanceSection = () => (
  <section id="s5" className="focus-sec focus-sec-light">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Master data governance: what it requires, and what it produces
        </h2>
        <p className="focus-p">
          Governance is not a system feature. It is a set of decisions about who is accountable, what the approval process is, and how compliance is monitored. The system enforces governance, but humans design it, and that distinction is where most governance efforts succeed or fail.
        </p>
        <p className="focus-p">
          Four components make it work. Ownership means a named data owner for each domain, accountable for quality and compliance. An approval workflow means structured review and approval for all new additions and material changes. Naming conventions means documented, enforced standards for how master data is recorded. A periodic audit means a scheduled review of each domain for accuracy, completeness, and deduplication. In practice, an approval workflow looks like this: new supplier requests are initiated by accounts payable, reviewed by the finance manager for credit and payment terms, and approved by the finance director above a value threshold, with bank-detail changes requiring separate approval and a verification step. That is the minimum that withstands audit scrutiny. The data owner role is not a full-time position in a mid-market business. It is an accountability assigned to an existing role, the finance manager owning the supplier master, the commercial director owning the customer master. Accountability without a named owner is no accountability at all.
        </p>
      </div>
    </div>
  </section>
);

            X3CloudDocs Supplier and Customer Onboarding Automation (SOA) automates the structured collection, validation, and approval of new supplier and customer data, creating governed master data records in Sage X3 without manual data entry. It applies the governance principles from the previous section as an automated workflow rather than as a manual discipline that depends on people remembering to follow it.

          <p className="focus-p">
            The process is straightforward in outline. A supplier submits their data through a structured onboarding form, the data is validated automatically against business registers and VAT databases, an approval workflow routes it for finance manager and finance director sign-off, and the approved record is created in Sage X3 with a complete audit trail. What it replaces is email-based onboarding, where a supplier sends bank details by email, the accounts payable team keys them in by hand, and the audit trail is an email thread.
          </p>

          <div className="pull-quote-navy" style={{ margin: '32px 0' }}>
            Bank-detail changes are the most common accounts payable fraud vector. SOA requires re-verification of bank details through the structured workflow rather than email approval. That is a material fraud control, not just a process efficiency.
          </div>

          <p className="focus-p" style={{ marginBottom: 32 }}>
            Mysoft's role places SOA within its Stage 2 X3CloudDocs implementation, alongside purchase invoice automation. Both capabilities depend on a clean supplier master to work correctly, and SOA is what creates and maintains that master, which is why the two are delivered together.
          </p>

          <Button variant="primary" onClick={() => { window.location.href = '../../../contact/'; }}>
            Speak to Mysoft about X3CloudDocs
          </Button>
        </div>
      </div>
    </section>
  );
};
