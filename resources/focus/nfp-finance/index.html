  { id: 's1', label: 'The NFP Finance Challenge' },
  { id: 's2', label: 'Fund Accounting' },
  { id: 's3', label: 'Grant Management' },
  { id: 's4', label: 'SORP & Reporting' },

  { id: 's6', label: 'AI for NFP Finance' },
  { id: 's7', label: 'Sage Intacct for NFP' },
  { id: 's8', label: 'Next Steps' },
];

const SectionNav = () => {
  const [active, setActive] = React.useState('s1');
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => { entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }); },
      { rootMargin: '-80px 0px -50% 0px', threshold: 0 }
    );
    NFP_NAV_ITEMS.forEach(({ id }) => { const el = document.getElementById(id); if (el) observer.observe(el); });
    return () => observer.disconnect();
  }, []);
  const scrollTo = (id) => {
    const el = document.getElementById(id); if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 140;
    window.scrollTo({ top, behavior: 'smooth' });
  };
  return (
    <>
      <nav className="section-nav">
        <div className="section-nav-inner">
          {NFP_NAV_ITEMS.map(({ id, label }) => (
            <a key={id} href={'#' + id}
              className={'section-nav-item' + (active === id ? ' active' : '')}
              onClick={e => { e.preventDefault(); scrollTo(id); }}>{label}</a>
          ))}
        </div>
      </nav>
      <nav className="section-nav-mobile">
        <select className="section-nav-select" value={active} onChange={e => scrollTo(e.target.value)}>
          {NFP_NAV_ITEMS.map(({ id, label }) => (<option key={id} value={id}>{label}</option>))}
        </select>
      </nav>
    </>
  );
};

// ─── SEC 1 ───────────────────────────────────────────────────────────────────

const ChallengeSection = () => (
  <section id="s1" className="focus-sec focus-sec-light">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Why NFP finance is structurally different, and why most accounting systems are structurally inadequate
        </h2>
        <p className="focus-p">
          Not-for-profit finance is not simpler than commercial finance. It is differently complex. The distinction between restricted and unrestricted funds, the compliance obligations attached to grants, and the SORP reporting framework all require capabilities that general-purpose accounting software does not provide. Software built to produce a profit and loss account and a balance sheet is being asked to do something it was not designed for, and the gap is filled by people and spreadsheets.
        </p>
        <p className="focus-p">
          The consequences of the wrong system are familiar to any not-for-profit finance director: fund balances tracked manually in spreadsheets, a period-end that takes weeks rather than days, grant reports rebuilt by hand from exported data, and intercompany reconciliation between the charity and its trading subsidiary managed outside the system entirely. Each of these is a control weakness as well as an inefficiency.
        </p>
        <p className="focus-p">
          There is also an expectation gap. Trustees increasingly expect the finance function to provide real-time insight into fund utilisation, programme performance, and organisational financial health, and spreadsheet-based reporting cannot meet that expectation reliably. The regulatory context raises the stakes further. Charity Commission reporting obligations, SORP compliance under FRS 102, Gift Aid processes, and the fiduciary duty of trustees together create an environment in which reporting accuracy is not optional. It is a governance requirement.
        </p>

        <div className="callout-yellow" style={{ marginTop: 32 }}>
          <span className="callout-label" style={{ color: '#8a6600' }}>SORP 2026: the regulatory context</span>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 14.5, lineHeight: 1.65, color: 'var(--fg-2)', margin: 0 }}>
            The Charities SORP was substantially updated in 2025. The Charities SORP 2026 was published on 31 October 2025 and applies to reporting periods beginning on or after 1 January 2026, with a transition date of 1 January 2025 for comparatives. It introduces a three-tier reporting framework based on income, brings most operating leases onto the balance sheet, requires income with performance conditions to be deferred until those conditions are met, requires accrual of untaken annual leave, and expands the Trustees' Annual Report. All SORP references on this page are to SORP 2026.
          </p>
        </div>
      </div>
    </div>
  </section>
);

// ─── SEC 2 ───────────────────────────────────────────────────────────────────

const FundAccountingSection = () => (
  <section id="s2" className="focus-sec focus-sec-alt">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Fund accounting: what it is, and what it requires from a financial system
        </h2>
        <p className="focus-p">
          Fund accounting is the practice of tracking income, expenditure, assets, and liabilities by fund, maintaining the distinction between restricted funds, where income must be used for a specified purpose, and unrestricted funds, available for general use at trustee discretion. It is the structural heart of not-for-profit finance, and it is precisely what general accounting software handles least well.
        </p>
        <p className="focus-p">
          In practice, fund accounting means every transaction must be attributed to the correct fund. Expenditure against a restricted grant has to be tracked against the grant's conditions, not just against a cost centre, and fund balances need to be available in real time rather than only at period end. General accounting software approximates this with a cost centre or department dimension, which works for simple structures and breaks down as complexity grows: when the number of funds moves beyond ten or fifteen, when fund conditions are intricate, or when sub-funds nest within parent funds.
        </p>
        <p className="focus-p">
          A modern financial management system handles fund accounting natively. Every transaction carries fund attribution as standard, restricted fund balances are maintained within the system, spending against fund conditions is tracked automatically, and over-commitment warnings are system-generated rather than manually monitored. The finance team stops policing fund boundaries by hand and starts relying on the system to enforce them.
        </p>

        <div className="callout-cyan" style={{ marginTop: 32 }}>
          <span className="callout-label" style={{ color: 'var(--cyan)' }}>Illustrative scenario</span>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 15, lineHeight: 1.7, color: 'var(--fg-2)', margin: '0 0 8px' }}>
            A housing charity managing 23 restricted grants and 4 endowments tracks fund balances, grant expenditure, and reporting obligations within Sage Intacct. At any point in the month, the finance team can query the current balance of any fund, the expenditure against it, and its remaining available balance, without opening a spreadsheet.
          </p>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 12.5, color: 'var(--muted)', margin: 0 }}>
            Illustrative scenario, not a named customer reference.
          </p>
        </div>
      </div>
    </div>
  </section>
);

// ─── SEC 3 ───────────────────────────────────────────────────────────────────

const GrantSection = () => (
  <section id="s3" className="focus-sec focus-sec-light">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Grant management: from award to compliance report
        </h2>
        <p className="focus-p">
          Grant management in a modern financial management system covers the full lifecycle: receipt, allocation to programme, expenditure tracking against grant conditions, monitoring report generation, and final account preparation. The system carries the grant from the day it is awarded to the day it is closed, with the audit trail intact throughout.
        </p>
        <p className="focus-p">
          The compliance dimension is what makes this matter. Grants typically carry specific expenditure conditions, by category, by time period, by geography, or by beneficiary type, and a breach of those conditions creates clawback risk. Tracking conditions manually in spreadsheets creates audit risk that is difficult to defend to a funder, because the evidence is a spreadsheet rather than a system record. Sage Intacct delivers project-level grant tracking with dimensional expenditure coding, real-time balances against grant conditions, monitoring report templates, and a complete audit trail of every grant-related transaction from receipt to close.
        </p>
        <p className="focus-p">
          The time saving is concrete. Grant compliance reports that take a finance team two days to compile from exported data can be produced in under an hour from a well-configured system, and they are more defensible because the system, not the spreadsheet, is the source.

);

// ─── SEC 4 ───────────────────────────────────────────────────────────────────

const SorpSection = () => (
  <section id="s4" className="focus-sec focus-sec-alt">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          SORP compliance: what the system should be doing so the finance team does not have to
        </h2>
        <p className="focus-p">
          The Charities SORP under FRS 102 defines the financial reporting framework for UK charities, and the current edition, SORP 2026, applies to periods beginning on or after 1 January 2026. It requires the Statement of Financial Activities, the balance sheet, and specific fund-level disclosures, and the 2026 edition adds a three-tier framework, on-balance-sheet treatment for most leases, and deferral of income carrying performance conditions, among other changes.
        </p>
        <p className="focus-p">
          This is where general accounting software reaches its limit. The Statement of Financial Activities is not a profit and loss account. It requires income and expenditure to be presented by fund type and by activity, which is a dimensional reporting requirement that standard accounting software cannot produce natively. A modern financial management system delivers SORP-compliant report templates configured within the system, producing the Statement of Financial Activities from the dimensional data model rather than assembling it by hand from an exported trial balance. Year-end statutory accounts preparation time falls materially as a result.
        </p>
        <p className="focus-p">
          Gift Aid is a related gain. Integrating income coding with Gift Aid reclaim eligibility removes a common source of error, because finance teams running manual processes frequently underclaim or misclaim Gift Aid, which is both a financial loss and a compliance exposure.
        </p>
      </div>
    </div>
  </section>
);

const MultiEntitySection = () => (

        </p>
        <p className="focus-p">

        <IntacctSection />
        <NextStepsSection />
      </main>
      <Footer basePath="../../../" onAssess={scrollToAssess} />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
