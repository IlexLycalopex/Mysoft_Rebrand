// ─── SEC 1 ───────────────────────────────────────────────────────────────────

const ChallengeSection = () => (
  <section id="s1" className="focus-sec focus-sec-light">

          Why SaaS finance is structurally different, and where most accounting systems reach their ceiling
        </h2>
        <p className="focus-p">
          SaaS finance differs structurally from general business finance in three ways. First, revenue recognition is complex: subscription revenue is earned over time, not at the point of invoicing, so what is billed and what is recognised diverge by design. Second, the metrics that define the business, ARR, MRR, NRR, churn, and cohort analysis, are not produced by standard accounting software at all. Third, SaaS businesses scale faster than most other models, creating multi-entity and multi-currency complexity faster than a finance function can manage by hand.
        </p>
        <p className="focus-p">
          The result is a deep spreadsheet dependency. The ARR waterfall lives in Excel, the MRR bridge in Excel, the churn cohort analysis in Excel, and the revenue recognition schedules in Excel. Each of those is a manual build, a version-control risk, and a source of the errors that auditors and investors are trained to look for. That matters because the investor expectation is unforgiving. Series A and B investors expect accurate SaaS metrics on demand, not two weeks after period end and not from a spreadsheet that one person maintains, and the inability to produce reliable metrics quickly is read as a due diligence red flag.
        </p>
        <p className="focus-p">
          Underneath the metrics sits a technical accounting risk. Revenue recognition for SaaS contracts under IFRS 15 and ASC 606, particularly contracts with usage-based components, modifications, or multiple elements, creates material misstatement risk when it is managed manually. The standards converge on the same five-step model, so getting one right usually means getting close on the other, but neither is forgiving of a spreadsheet approach at scale.
        </p>
      </div>
    </div>
  </section>
);

// ─── SEC 2: METRICS ──────────────────────────────────────────────────────────

// ─── SEC 3: REVENUE RECOGNITION ───────────────────────────────────────────────

const RevRecSection = () => (
  <section id="s3" className="focus-sec focus-sec-light">
    <div className="container">
      <div className="narrow">
        <h2 className="sec-h2" style={{ marginBottom: 28 }}>
          Revenue recognition for SaaS: the compliance risk hidden in your spreadsheets
        </h2>
        <p className="focus-p">
          IFRS 15 and ASC 606 require revenue to be recognised as performance obligations are satisfied, not when an invoice is raised and not when cash is received. For SaaS, that means subscription revenue is recognised ratably over the contract term, because the customer receives the benefit continuously. Usage-based components are recognised as usage occurs, setup fees may be recognised over the expected customer relationship rather than on day one, and contract modifications such as upgrades, downgrades, and extensions require the performance obligation to be reassessed. Where a contract bundles distinct elements, the value is allocated across them by standalone selling price.
        </p>
        <p className="focus-p">
          The manual risk here is real and increasingly scrutinised. A SaaS business managing revenue recognition in spreadsheets carries material misstatement risk, and auditors are paying closer attention to this area. The common errors are predictable: recognising an annual contract in full on the invoice date, failing to defer and release setup fees correctly, and not reassessing revenue when a contract is modified. A modern financial management system applies automated recognition rules configured by contract type, calculating recognised and deferred revenue automatically and producing the revenue waterfall and deferred revenue schedule as system reports rather than spreadsheet builds. The audit benefit is decisive: automated recognition with a complete audit trail is far more defensible than manual calculation, because the system produces the evidence and the auditor reviews the rules rather than reconstructing the workings.
        </p>
        <div className="xref-note" style={{ marginTop: 8 }}>

        </div>
      </div>
    </div>
  </section>
);
